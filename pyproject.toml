[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sttbench"
version = "0.1.0"
description = "Local, model-agnostic STT inspection and evaluation CLI"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub",
  "numpy",
  "openai-whisper",
  "PyYAML",
]

[project.scripts]
sttbench = "sttbench.cli:main"

[tool.setuptools.packages.find]
include = ["sttbench*"]
